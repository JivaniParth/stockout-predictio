name: HSCM Platform Quality & Verification Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Code Hygiene & Static Analysis (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff Linter
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

  tests-and-quality-gates:
    name: Pytest Verification & Architectural Boundary Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite (46 Tests)
        run: pytest tests/ -v

      - name: Clean Architecture Boundary Audit
        run: pytest tests/test_clean_architecture.py -v

      - name: API Microservice Smoke Test
        run: |
          python main.py decide
          pytest tests/test_api_serving.py -v

      - name: UI Compilation Smoke Test
        run: |
          python -m py_compile src/scms/ui/app.py
          python -m py_compile src/scms/ui/pages/*.py
