name: HSCM CI/CD & Free-Tier Cloud Delivery Pipeline

# Trigger on commits, PRs, and weekly scheduled drift detection cron
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Runs weekly on Monday at 03:00 UTC (within GitHub Actions free allowance)
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Free-Tier Guardrail Annotations:
# - GitHub Actions: $12/month allowance (~2,000 Linux 2-core x64 minutes or 1,200 Windows minutes)
# - GitHub Packages (GHCR): 500 MB included storage, 1 GB data transfer out/month
# - Docker Cache: 10 GB per repository storage ceiling

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest optuna shap requests locust

      - name: Syntax and Style Linting
        run: |
          python -m py_compile src/data/*.py
          python -m py_compile src/models/*.py
          python -m py_compile src/evaluation/*.py
          python -m py_compile deploy/*.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --maxfail=1

      - name: Execute Scheduled Drift Audit (If Triggered by Cron)
        if: github.event_name == 'schedule'
        run: |
          python deploy/drift_retrain_cron.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image with Docker Layer Caching (type=gha)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/hscm-prediction-api:latest
            ghcr.io/${{ github.repository }}/hscm-prediction-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Smoke-Test & High-Entropy Load Test against Local Container
        if: github.event_name != 'schedule'
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository }}/hscm-prediction-api:latest"
          if [[ "${{ github.event_name }}" != "push" || "${{ github.ref }}" != "refs/heads/main" ]]; then
            IMAGE_TAG="ghcr.io/${{ github.repository }}/hscm-prediction-api:latest"
          fi
          docker run -d --name hscm-smoke -p 8000:8000 $IMAGE_TAG || docker run -d --name hscm-smoke -p 8000:8000 $(docker images -q | head -n1)
          sleep 12
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:8000/ready || exit 1
          curl -f http://localhost:8000/metrics || exit 1

          # Run dynamic load generator with 50 unique non-repeating payloads
          python deploy/load_test_generator.py --endpoint http://localhost:8000/predict -n 50 -c 5 -o reports/ci_load_test.json
          docker stop hscm-smoke
