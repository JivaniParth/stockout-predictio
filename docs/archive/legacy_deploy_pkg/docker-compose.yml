version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Transactional Database
  postgres:
    image: postgres:16-alpine
    container_name: hscm_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: hscm_db
      POSTGRES_USER: hscm_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hscm_secure_cloud_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hscm_admin -d hscm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M

  # 2. Redis 7 Distributed Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: hscm_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-hscm_redis_secret_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hscm_redis_secret_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 3. High-Throughput RESTful API Microservice
  api:
    build:
      context: ../..
      dockerfile: src/deployment/Dockerfile
    container_name: hscm_api_cluster
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8000
      - WORKERS=4
      - DATABASE_URL=postgresql://hscm_admin:${DB_PASSWORD:-hscm_secure_cloud_pass_2026}@postgres:5432/hscm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hscm_redis_secret_2026}@redis:6379/0
      - DEVICE=cpu
      - RATE_LIMIT_PER_MIN=600
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '1.0'
          memory: 1024M

  # 4. Asynchronous Background Manifest Scoring Worker
  worker:
    build:
      context: ../..
      dockerfile: src/deployment/Dockerfile
    container_name: hscm_background_worker
    restart: unless-stopped
    command: ["python", "-m", "src.infrastructure.queue.task_queue"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://hscm_admin:${DB_PASSWORD:-hscm_secure_cloud_pass_2026}@postgres:5432/hscm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hscm_redis_secret_2026}@redis:6379/0
      - CONCURRENCY=8
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: hscm_cloud_network
